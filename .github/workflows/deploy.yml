name: Deploy UXer

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UXER_DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.UXER_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to server
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude '.git/' \
            --exclude 'client/node_modules/' \
            --exclude 'client/dist/' \
            ./ "${{ secrets.UXER_DEPLOY_USER }}@${{ secrets.UXER_DEPLOY_HOST }}:/opt/uxer/"

      - name: Build and restart UXer
        env:
          DEPLOY_HOST: ${{ secrets.UXER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.UXER_DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'set -eu
            cd /opt/uxer
            test -f .env
            podman build -t uxer:latest -f Containerfile .
            podman volume inspect uxer-data >/dev/null 2>&1 || podman volume create uxer-data >/dev/null
            podman rm -f uxer >/dev/null 2>&1 || true
            podman run -d \
              --name uxer \
              --restart=unless-stopped \
              -p 8080:8080 \
              -v uxer-data:/app/data \
              --env-file /opt/uxer/.env \
              uxer:latest >/dev/null
            sleep 3
            podman ps --filter name=uxer --format "{{.Status}}" | grep -q "Up"
            curl -fsS http://127.0.0.1:8080/ >/dev/null
          '
